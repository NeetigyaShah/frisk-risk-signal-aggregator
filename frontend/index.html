<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frisk — Financial Risk Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { theme: { extend: {
  fontFamily: { sans: ['Inter','sans-serif'] },
  colors: {
    ink:'#e8edf7', muted:'#94a3b8', faint:'#64748b',
    bg:'#0a0e1a', panel:'#111826', panel2:'#0d1320', line:'#1e293b', line2:'#273449',
    brand:'#3b82f6', brand2:'#6366f1',
    low:'#22c55e', med:'#f59e0b', high:'#ef4444', review:'#f97316',
  }
}}}
</script>
<link rel="stylesheet" href="/styles.css">
</head>
<body class="bg-bg text-ink font-sans antialiased">

<div class="flex min-h-screen">
  <!-- Sidebar -->
  <aside class="w-60 shrink-0 border-r border-line bg-panel2 flex flex-col fixed h-screen">
    <div class="px-5 py-5 border-b border-line">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-brand to-brand2 grid place-items-center text-lg">🛡</div>
        <div><div class="font-extrabold tracking-tight leading-none">Frisk</div>
        <div class="text-[11px] text-faint">Risk Signal Intelligence</div></div>
      </div>
    </div>
    <nav class="p-3 flex flex-col gap-1 text-sm" id="nav">
      <a data-view="dashboard" class="nav-item">📊 <span>Dashboard</span></a>
      <a data-view="review"    class="nav-item">🟠 <span>Review Queue</span> <b id="rqcount" class="ml-auto text-xs bg-review/20 text-review px-1.5 rounded"></b></a>
      <a data-view="ingest"    class="nav-item">📤 <span>Ingest / Upload</span></a>
      <a data-view="audit"     class="nav-item">📜 <span>Audit Trail</span></a>
    </nav>
    <div class="mt-auto p-4 text-[11px] text-faint border-t border-line" id="broker">broker: …</div>
  </aside>

  <!-- Main -->
  <main class="flex-1 ml-60">
    <header class="sticky top-0 z-10 bg-bg/85 backdrop-blur border-b border-line px-8 py-4 flex items-center gap-4">
      <h1 id="title" class="text-lg font-bold">Dashboard</h1>
      <p id="subtitle" class="text-sm text-muted"></p>
      <div class="ml-auto flex gap-2" id="topstats"></div>
    </header>
    <section id="content" class="p-8 max-w-[1200px]"></section>
  </main>
</div>

<!-- Case slide-over -->
<div id="drawer" class="fixed inset-0 z-30 hidden">
  <div class="absolute inset-0 bg-black/60" onclick="closeDrawer()"></div>
  <div class="absolute right-0 top-0 h-full w-full max-w-[720px] bg-panel border-l border-line overflow-y-auto shadow-2xl" id="drawer-body"></div>
</div>

<script src="/app.js"></script>
</body>
</html>
