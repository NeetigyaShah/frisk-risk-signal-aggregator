<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frisk — Financial Risk Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<!-- App shell: CSS grid (sidebar | content). No fixed positioning, so nothing can overflow. -->
<div class="shell" id="shell">

  <!-- ───────────── Sidebar ───────────── -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">🛡</div>
      <div class="brand-text">
        <b>Frisk</b>
        <span>Risk Signal Intelligence</span>
      </div>
    </div>

    <button class="search-btn" onclick="openPalette()">
      <span>🔍</span><span class="search-btn-t">Search cases</span><kbd>⌘K</kbd>
    </button>

    <nav id="nav">
      <p class="nav-head">Triage</p>
      <a data-view="dashboard" class="nav-item"><i>📊</i><span>Dashboard</span></a>
      <a data-view="review"    class="nav-item"><i>🟠</i><span>Review Queue</span><b id="rqcount"></b></a>
      <p class="nav-head">Investigate</p>
      <a data-view="compare" class="nav-item"><i>⚖️</i><span>Case Comparison</span></a>
      <a data-view="sar"     class="nav-item"><i>📋</i><span>SAR Drafts</span></a>
      <p class="nav-head">Data</p>
      <a data-view="ingest" class="nav-item"><i>📤</i><span>Ingest / Upload</span><b id="ingbadge"></b></a>
      <a data-view="audit"  class="nav-item"><i>📜</i><span>Audit Trail</span></a>
    </nav>

    <div class="sidebar-foot">
      <span id="broker">broker: …</span>
      <button onclick="toggleRail()" title="Collapse" class="icon-btn">⇤</button>
    </div>
  </aside>

  <!-- ───────────── Main ───────────── -->
  <div class="main">
    <header class="topbar">
      <button onclick="toggleRail()" class="icon-btn">☰</button>
      <div class="crumb"><span>Frisk</span><em>/</em><b id="title">Dashboard</b></div>
      <p id="subtitle"></p>
      <div class="topstats" id="topstats"></div>
    </header>
    <main id="content"></main>
  </div>
</div>

<!-- Case slide-over -->
<div id="drawer" class="overlay hidden">
  <div class="overlay-bg" onclick="closeDrawer()"></div>
  <div class="drawer-panel" id="drawer-body"></div>
</div>

<!-- ⌘K palette -->
<div id="palette" class="overlay hidden">
  <div class="overlay-bg" onclick="closePalette()"></div>
  <div class="palette-panel">
    <div class="palette-input">
      <span>🔍</span>
      <input id="pq" oninput="paletteFilter()" placeholder="Search by name, id, occupation, country…" autocomplete="off">
      <kbd onclick="closePalette()">ESC</kbd>
    </div>
    <div id="presults"></div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
