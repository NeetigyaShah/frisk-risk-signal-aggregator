<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frisk — Financial Risk Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
tailwind.config = { theme: { extend: {
  fontFamily: { sans: ['Inter','sans-serif'], mono: ['JetBrains Mono','monospace'] },
  colors: {
    ink:'#e8edf7', muted:'#94a3b8', faint:'#64748b',
    bg:'#0a0e1a', panel:'#111826', panel2:'#0d1320', line:'#1e293b', line2:'#273449',
    brand:'#3b82f6', brand2:'#6366f1',
    low:'#22c55e', med:'#f59e0b', high:'#ef4444', review:'#f97316',
  }
}}}
</script>
<link rel="stylesheet" href="/styles.css">
</head>
<body class="bg-bg text-ink font-sans antialiased">

<div class="flex min-h-screen">
  <!-- Sidebar (collapsible) -->
  <aside id="sidebar" class="w-[248px] shrink-0 border-r border-line bg-panel2 flex flex-col fixed h-screen z-20 transition-all duration-300">
    <div class="px-4 py-4 border-b border-line">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-brand to-brand2 grid place-items-center text-lg shadow-lg shrink-0">🛡</div>
        <div class="sb-label min-w-0">
          <div class="font-extrabold tracking-tight leading-none truncate">Frisk</div>
          <div class="text-[11px] text-faint truncate">Risk Signal Intelligence</div>
        </div>
      </div>
    </div>

    <!-- ⌘K search -->
    <div class="px-3 pt-3 sb-label">
      <button onclick="openPalette()" class="w-full flex items-center gap-2 px-2.5 py-2 rounded-lg bg-panel border border-line text-muted hover:text-ink hover:border-line2 transition text-[13px]">
        <span>🔍</span><span class="flex-1 text-left">Search cases…</span>
        <kbd class="text-[10px] font-mono text-faint border border-line rounded px-1">⌘K</kbd>
      </button>
    </div>

    <nav class="p-3 flex flex-col gap-4 text-sm overflow-y-auto flex-1" id="nav">
      <div class="flex flex-col gap-0.5">
        <span class="sb-head">Triage</span>
        <a data-view="dashboard" class="nav-item"><span class="ico">📊</span><span class="sb-label">Dashboard</span></a>
        <a data-view="review"    class="nav-item"><span class="ico">🟠</span><span class="sb-label">Review Queue</span>
          <b id="rqcount" class="ml-auto text-[10px] bg-review/20 text-review px-1.5 rounded-full sb-label"></b></a>
      </div>
      <div class="flex flex-col gap-0.5">
        <span class="sb-head">Data</span>
        <a data-view="ingest"    class="nav-item"><span class="ico">📤</span><span class="sb-label">Ingest / Upload</span></a>
        <a data-view="audit"     class="nav-item"><span class="ico">📜</span><span class="sb-label">Audit Trail</span></a>
      </div>
    </nav>

    <div class="mt-auto border-t border-line p-3 flex items-center gap-2">
      <div class="text-[11px] text-faint sb-label flex-1 truncate" id="broker">broker: …</div>
      <button onclick="toggleSidebar()" title="Collapse sidebar"
        class="p-1.5 rounded-md text-faint hover:text-ink hover:bg-panel transition shrink-0">⇤</button>
    </div>
  </aside>

  <!-- Main -->
  <main id="main" class="flex-1 ml-[248px] transition-all duration-300">
    <header class="sticky top-0 z-10 bg-bg/85 backdrop-blur border-b border-line px-8 py-3.5 flex items-center gap-3">
      <button onclick="toggleSidebar()" class="p-1.5 -ml-1 rounded-md text-faint hover:text-ink hover:bg-panel transition">☰</button>
      <div class="flex items-center gap-2 text-sm min-w-0">
        <span class="text-faint">Frisk</span><span class="text-line2">/</span>
        <span id="title" class="font-semibold truncate">Dashboard</span>
      </div>
      <p id="subtitle" class="text-sm text-muted truncate hidden lg:block"></p>
      <div class="ml-auto flex gap-2 shrink-0" id="topstats"></div>
    </header>
    <section id="content" class="p-8 max-w-[1240px]"></section>
  </main>
</div>

<!-- Case slide-over -->
<div id="drawer" class="fixed inset-0 z-30 hidden">
  <div class="absolute inset-0 bg-black/60 backdrop-blur-[2px]" onclick="closeDrawer()"></div>
  <div class="absolute right-0 top-0 h-full w-full max-w-[760px] bg-panel border-l border-line overflow-y-auto shadow-2xl" id="drawer-body"></div>
</div>

<!-- ⌘K command palette -->
<div id="palette" class="fixed inset-0 z-40 hidden">
  <div class="absolute inset-0 bg-bg/50 backdrop-blur-sm" onclick="closePalette()"></div>
  <div class="relative mx-auto mt-[14vh] w-full max-w-xl bg-panel border border-line rounded-xl shadow-2xl overflow-hidden zoom">
    <div class="flex items-center px-4 border-b border-line">
      <span class="text-muted mr-3">🔍</span>
      <input id="pq" oninput="paletteFilter()" placeholder="Search customers by name, id, occupation…"
        class="flex-1 bg-transparent py-3.5 outline-none text-sm placeholder:text-faint">
      <kbd onclick="closePalette()" class="text-[10px] font-mono text-faint border border-line rounded px-1.5 py-0.5 cursor-pointer">ESC</kbd>
    </div>
    <div id="presults" class="max-h-[46vh] overflow-y-auto p-2"></div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
