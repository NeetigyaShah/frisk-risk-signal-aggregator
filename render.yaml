services:
  - type: web
    name: frisk
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && pip install -e .
    startCommand: uvicorn frisk.api.service:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/stats
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: FRISK_PROVIDER
        value: mock
      # ponytail: no Redis on free tier — hitl/redis_conn falls back to the in-process store.
