[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "frisk"
version = "0.1.0"
description = "Financial Risk Signal Aggregator — AML/financial-crime risk triage"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "Faker>=25.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# LLM cross-check is optional — the engine runs deterministically (rules-only / mock) without any of these.
llm = [
    "instructor>=1.5",
    "openai>=1.40",
    "google-genai>=1.0",
    "anthropic>=0.40",
    "langgraph>=1.0",
    "langchain-openai>=1.0",
    "langchain-core>=0.3",
]
ui = ["streamlit>=1.36"]
observability = ["langsmith>=0.10"]
dev = ["pytest>=8.0"]

[project.scripts]
frisk = "frisk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
