[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "frisk"
version = "0.1.0"
description = "Financial Risk Signal Aggregator — AML/financial-crime risk triage"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "Faker>=25.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Real LLM providers. Without these the app still runs end-to-end on the deterministic mock provider.
llm = [
    "instructor>=1.5",          # schema-validated structured output
    "openai>=1.40",             # OpenAI-compatible client (OpenRouter, NVIDIA)
    "langchain-openai>=1.0",    # tool-calling chat model for the agent loop
    "langchain-core>=0.3",      # StructuredTool definitions
    "anthropic>=0.40",          # optional alternate provider
]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9", "redis>=5.0"]
observability = ["langsmith>=0.10"]
dev = ["pytest>=8.0"]

[project.scripts]
frisk = "frisk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
